      xcode: latest
      node: v22
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          cd ios-app
          npm ci --no-audit --no-fund
      - name: Capacitor sync iOS
        script: |
          cd ios-app
          npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Diagnose Apple API access
        script: |
          echo "=== bundle ids ==="
          app-store-connect bundle-ids list 2>&1 | head -30 || true
          echo "=== certificates ==="
          app-store-connect certificates list 2>&1 | head -30 || true
          echo "=== profiles ==="
          app-store-connect profiles list 2>&1 | head -30 || true
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Increment build number
        script: |
          cd ios-app/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project use-profiles
          if ! xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"; then
            echo "======== XCODEBUILD ERRORS ========"
            grep -h "error:" /tmp/xcodebuild_logs/*.log 2>/dev/null | sort -u | head -50
            exit 65
          fi
    artifacts:
      - ios-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
